<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/assets/icons/bookmark-white.svg"
      type="image/svg+xml"
    />
    <title>My Library</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/my-library.css" />
    <script src="/src/js/pages/my-library.js" type="module"></script>
  </head>
  <body>
    <header id="nav-bar">
      <!-- Navbar rendered by JavaScript -->
    </header>
    <main>
      <h1 class="my-books-h1">My Library</h1>
      <!-- Empty state -->
      <div class="empty-state-hidden" hidden>
        <section class="empty-state">
          <h2 class="empty-state-h2 empty-state-text">
            You haven't saved any books yet.
          </h2>
          <p class="empty-state-p empty-state-text">
            Explore your library and save books you'd like to read.
          </p>
          <a href="/index.html" class="discover-btn"> Discover Books </a>
        </section>
      </div>
      <!-- Saved Books -->
      <!-- Input -->
      <section class="saved-book-section" hidden>
        <label for="saved-book-search" class="sr-only">
          Search your saved books
        </label>
        <div class="saved-input-search-container">
          <input
            type="search"
            id="saved-book-search"
            placeholder="Search your collection..."
          />
          <button class="clear-search" aria-label="Clear Search" type="button">
            <img src="/assets/icons/x.svg"  alt="" />
          </button>
        </div>
        <!-- Books -->
        <ul id="saved-books-grid">
          <!-- Saved books Rendered By JavaScript -->
        </ul>
      </section>
    </main>
  </body>
</html>

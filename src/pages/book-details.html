<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/assets/icons/book-bookmark.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/book-details.css" />
    <script
      defer
      type="module"
      src="/src/js/components/book-details.js"
    ></script>
    <title>Book details</title>
    <!-- render title with js  ${book.name} -->
  </head>
  <body>
    <header id="nav-bar">
      <!-- Navbar  -->
    </header>
    <main>
      <section id="book-details-section">
        <img
          class="book-details-img"
          src=""
          alt=""
        />
        <div class="details-wrapper">
          <div class="main-details">
            <h1 class="book-title"></h1>
            <p class="author-text"></p>
          </div>
          <div class="desc-save-btn">
            <p class="desc-text">
            </p>
            <button type="button" class="save-btn">Save to My Books</button>
          </div>
        </div>
      </section>
      <!-- Book Info -->
      <section class="additional-details">
        <h2 class="book-info-h2">Book Info</h2>
        <div class="topics info-wrapper">
          <p class="info-name">Topics</p>
          <ul class="topic-list">
            <!-- Topics rendered by JavaScript -->
          </ul>
        </div>
        <dl>
          <div class="info-wrapper">
            <dt class="info-name">Number of pages</dt>
            <dd class="pages dd-text"></dd>
          </div>
          <div class="info-wrapper">
            <dt class="info-name">First Published</dt>
            <dd class="publish-date dd-text"></dd>
          </div>
          <div class="info-wrapper">
            <dt class="info-name">Publisher</dt>
            <dd class="publisher dd-text"></dd>
          </div>
        </dl>
      </section>
      <div class="back-btn-container">
        <button type="button" class="back-btn">Go back</button>
      </div>
    </main>
  </body>
</html>
